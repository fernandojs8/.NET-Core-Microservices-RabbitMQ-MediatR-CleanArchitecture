name: microrabbit
x-api: &api
  restart: unless-stopped
  environment: &settings
    ASPNETCORE_ENVIRONMENT: Development
    DisableHttpsRedirection: "true"
    RabbitMQ__HostName: rabbitmq
    RabbitMQ__UserName: ${RABBIT_USER:?Copy .env.example to .env}
    RabbitMQ__Password: ${RABBIT_PASSWORD:?Set RABBIT_PASSWORD}
    ConnectionStrings__BankingDbConnection: Server=sql;Database=BankingDB;User Id=sa;Password=${SQL_PASSWORD:?Set SQL_PASSWORD};TrustServerCertificate=True
    ConnectionStrings__TransferDbConnection: Server=sql;Database=TransferDB;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD}
    ports: ["127.0.0.1:1433:1433"]
    volumes: ["sql-data:/var/opt/mssql"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.2-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  migrate-banking:
    <<: *api
    restart: "no"
    build: {context: ., args: {PROJECT: MicroRabbit.Banking.Api}}
    command: ["MicroRabbit.Banking.Api.dll", "--migrate"]
    depends_on: {sql: {condition: service_healthy}}
  migrate-transfer:
    <<: *api
    restart: "no"
    build: {context: ., args: {PROJECT: MicroRabbit.Transfer.Api}}
    command: ["MicroRabbit.Transfer.Api.dll", "--migrate"]
    depends_on: {sql: {condition: service_healthy}}
  banking:
    <<: *api
    build: {context: ., args: {PROJECT: MicroRabbit.Banking.Api}}
    command: ["MicroRabbit.Banking.Api.dll"]
    ports: ["127.0.0.1:5000:8080"]
    depends_on:
      migrate-banking: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
  transfer:
    <<: *api
    build: {context: ., args: {PROJECT: MicroRabbit.Transfer.Api}}
    command: ["MicroRabbit.Transfer.Api.dll"]
    ports: ["127.0.0.1:5002:8080"]
    depends_on:
      migrate-transfer: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
volumes:
  sql-data:
  rabbit-data:
